[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

[default]
; Allow calls between registered endpoints
exten => _X.,1,NoOp(Incoming call to ${EXTEN})
exten => _X.,n,Dial(PJSIP/${EXTEN})
exten => _X.,n,Hangup()

; Echo test extension
exten => 1000,1,Answer()
exten => 1000,n,Wait(1)
exten => 1000,n,Playback(hello-world)
exten => 1000,n,Hangup()

