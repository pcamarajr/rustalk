[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; TLS transport disabled - certificates not configured
; [transport-tls]
; type=transport
; protocol=tls
; bind=0.0.0.0:5061
; cert_file=/etc/asterisk/keys/asterisk.crt
; priv_key_file=/etc/asterisk/keys/asterisk.key

[testuser]
type=endpoint
context=default
disallow=all
allow=ulaw
allow=alaw
allow=gsm
transport=transport-udp
auth=testuser-auth
aors=testuser

[testuser-auth]
type=auth
auth_type=userpass
password=testpass
username=testuser

[testuser]
type=aor
max_contacts=1
contact=sip:testuser@127.0.0.1

